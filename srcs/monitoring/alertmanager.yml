global:
  resolve_timeout: 5m

route:
  # Group alerts by these labels
  group_by: ['alertname', 'severity']

  # How long to wait before sending notification about new group
  group_wait: 10s

  # How long to wait before sending notification about new alerts added to a group
  group_interval: 10s

  # How long to wait before sending notification again if alert is still firing
  repeat_interval: 1h

  # Default receiver
  receiver: 'discord'

  # Child routes for different severities
  routes:
    - match:
        severity: critical
      receiver: 'discord-critical'
      repeat_interval: 30m

    - match:
        severity: warning
      receiver: 'discord'
      repeat_interval: 2h

receivers:
  # Critical alerts (immediate attention needed)
  - name: 'discord-critical'
    webhook_configs:
      - url: 'http://discord-adapter:9094/webhook/critical'
        send_resolved: true

  # Warning alerts (monitor but not urgent)
  - name: 'discord'
    webhook_configs:
      - url: 'http://discord-adapter:9094/webhook/warning'
        send_resolved: true

# Inhibition rules - don't send certain alerts if others are firing
inhibit_rules:
  # If a service is down, don't alert about its high latency/errors
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['job']
