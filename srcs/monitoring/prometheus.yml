# Prometheus configuration

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rules
rule_files:
  - /etc/prometheus/alert_rules.yml

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # Prometheus monitors itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Redis metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # Container metrics (cAdvisor)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Application services
  - job_name: 'auth'
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ['auth_app:3000']

  - job_name: 'live-chat'
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ['live-chat_app:3002']

  - job_name: 'realtime-sockets'
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ['realtime-sockets_app:3003']

  - job_name: 'remote-players'
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ['remote-players_app:3004']

  - job_name: 'backend-ai'
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ['backend-ai_app:3004']

  - job_name: 'game-engine'
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ['game-engine_app:3007']

  - job_name: 'server-rendering'
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ['server-rendering_app:3005']

  - job_name: 'mail'
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ['mail:3300']
