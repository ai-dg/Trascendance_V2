user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections	768;
}


http {
	map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
	}
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	log_format json_combined escape=json
	'{ "time_local": "$time_local", '
	'"remote_addr": "$remote_addr", '
	'"request": "$request", '
	'"status": "$status", '
	'"body_bytes_sent": "$body_bytes_sent", '
	'"http_referer": "$http_referer", '
	'"http_user_agent": "$http_user_agent", '
	'"request_time": "$request_time" }';

	access_log /dev/stdout;
	error_log /dev/stderr;

	server {
		listen 8080;
		server_name localhost;



		location / {
			proxy_pass https://server-rendering_app:3005/;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		location /scores/ {
			proxy_pass https://blockchain:4000/;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		location /public/ {
    		proxy_pass http://frontend_app:3006/public/;
    		proxy_http_version 1.1;
    		proxy_set_header Host $host;
    		proxy_set_header X-Real-IP $remote_addr;
    		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    		proxy_set_header X-Forwarded-Proto $scheme;
		}

		location /locales/ {
		    proxy_pass http://frontend_app:3006/locales/;
		    proxy_http_version 1.1;
		    proxy_set_header Host $host;
		    proxy_set_header X-Real-IP $remote_addr;
		    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		    proxy_set_header X-Forwarded-Proto $scheme;
		}

		location /auth/ {
			proxy_pass https://auth_app:3000/;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		# Temporarily commented out - language-manager has sqlite3 native module issues
		# location /language-manager/ {
		# 	proxy_pass https://language-manager_app:3001/;
		# 	proxy_http_version 1.1;
		# 	proxy_set_header Host $host;
		# 	proxy_set_header X-Real-IP $remote_addr;
		# 	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		# 	proxy_set_header X-Forwarded-Proto $scheme;
		# }

		# Temporarily commented out - live-chat has sqlite3 native module issues
		# location /live-chat/ {
		# 	proxy_pass https://live-chat_app:3002/;
		# 	proxy_http_version 1.1;
		# 	proxy_set_header Host $host;
		# 	proxy_set_header X-Real-IP $remote_addr;
		# 	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		# 	proxy_set_header X-Forwarded-Proto $scheme;
		# }

		# location /socket.io/ {
		# 	proxy_pass http://realtime-sockets_app:3003/socket.io;

		# 	proxy_ssl_verify off;
		# 	proxy_ssl_server_name on;

		# 	proxy_http_version 1.1;
		# 	proxy_set_header Host $host;
		# 	proxy_set_header X-Real-IP $remote_addr;
		# 	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		# 	proxy_set_header X-Forwarded-Proto $scheme;
		# 	proxy_set_header Upgrade $http_upgrade;
        # 	proxy_set_header Connection "Upgrade";
		# 	proxy_buffering off;

		# 	proxy_read_timeout 3600s;
        # 	proxy_send_timeout 3600s;
		# }

		location /realtime-sockets/ {
			proxy_pass https://realtime-sockets_app:3003;
			proxy_http_version 1.1;

			proxy_ssl_verify off;
			proxy_ssl_server_name on;

			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;

			# Gestion correcte du WebSocket
			proxy_set_header Upgrade $http_upgrade;
			# proxy_set_header Connection $connection_upgrade;
			proxy_set_header Connection "Upgrade";

			# Permet les requêtes longues WebSocket
			proxy_read_timeout 3600s;
			proxy_send_timeout 3600s;
		}

		location /backend-ai/ {
			proxy_pass https://backend-ai_app:3004/;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		location /game-engine/ {
			proxy_pass https://game-engine_app:3007/;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

	}

}
