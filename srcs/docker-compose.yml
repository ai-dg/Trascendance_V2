services:


######################################################################
#************************** 🧬 PROXY / NGINX *************************
######################################################################


  modsecurity:
    container_name: modsecurity
    build:
      context: .
      dockerfile: ./services/security/modsecurity/Dockerfile
      args:
        HOME: ${HOME}
        NODE_ENV: ${NODE_ENV}
    ports:
      - 443:443
    networks:
      - internal
    expose:
      - 443
    env_file:
      - .env
    depends_on:
      - gateway

  vault:
    container_name: vault
    image: hashicorp/vault:latest
    ports:
      - "8200:8200"
    volumes:
      - ./services/vault/init:/
      - ./services/vault/config:/vault/config
      - ./services/vault/data:/vault/data
      - ./services/vault/logs:/vault/logs
    environment:
      VAULT_ADDR: 'http://0.0.0.0:8200'
    cap_add:
      - IPC_LOCK
    command: server
    networks:
      - internal


  gateway:
    container_name: gateway
    build:
      context: .
      args: {}
      dockerfile: ./services/gateway/Dockerfile
    networks:
    - transcendence
    - internal
    ports:
      - 8080:8080
    expose:
      - 8080
    volumes:
      - ./services/gateway/nginx/nginx.conf:/etc/nginx/nginx.conf
    user: "0:0"
    restart: unless-stopped
    environment: {}
    depends_on:
      - auth_app
      - live-chat_app
      - realtime-sockets_app
      - frontend_app


######################################################################
#************************** 📦 BACKEND *******************************
######################################################################

# AUTH_SERVICE : 3000
# LANGUAGE_MANAGER_SERVICE : 3001
# LIVE_CHAT_SERVICE : 3002
# REMOTE_PLAYER_SERVICE : 3003
# MATCH_MAKING : 3004
# SERVER-RENDERING : 3003
# game-engine : 3007
# BLOCKCHAIN : 4000

  server-rendering_app:
    container_name: server-rendering_app
    build:
      context: ./services
      dockerfile: server-rendering/app/Dockerfile
    expose:
      - 3005
    volumes:
      - /data/node_modules
      # - ./services/server-rendering/app:/data
      # - sqlite_data:/data
      # - ./volume/redis_data:/data
      - ./certs:/certs:ro
    networks:
      - internal
    environment:
      - NODE_ENV=${NODE_ENV}
      - VAULT_ADDR=${VAULT_ADDR}
      - VAULT_TOKEN=${VAULT_ROOT_TOKEN}
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    restart: on-failure

  auth_app:
    container_name: auth_app
    build:
      context: ./services/auth/app
    expose:
      - 3000
    environment:
      - NODE_ENV=${NODE_ENV}
      - VAULT_ADDR=${VAULT_ADDR}
      - VAULT_TOKEN=${VAULT_ROOT_TOKEN}
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    volumes:
      - /data/node_modules
      # - sqlite_data:/data/sqlite
      # - ./volume/redis_data:/data
      - ./services/auth/app:/data
      - ./certs:/certs:ro
    networks:
      - internal
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    restart: on-failure

  language-manager:
    container_name: language-manager_app
    build:
      context: ./services/language-manager
    expose:
      - 3001
    environment:
      - NODE_TLS_REJECT_UNAUTHORIZED=0
        - VAULT_ADDR=${VAULT_ADDR}
      - VAULT_TOKEN=${VAULT_ROOT_TOKEN}
      - NODE_ENV=${NODE_ENV}
    volumes:
      - ./services/language-manager:/data
      - /data/node_modules
      - ./certs:/certs:ro
    networks:
      - internal

  live-chat_app:
    container_name: live-chat_app
    build:
      context: ./services/live-chat/app
    expose:
      - 3002
    environment:
      - NODE_ENV=${NODE_ENV}
      - VAULT_ADDR=${VAULT_ADDR}
      - VAULT_TOKEN=${VAULT_ROOT_TOKEN}
    volumes:
      - ./services/live-chat/app:/data
      - /data/node_modules
      - ./certs:/certs:ro
    networks:
      - internal
    depends_on:
      redis:
        condition: service_started

  realtime-sockets_app:
    container_name: realtime-sockets_app
    build:
      context: ./services/realtime-sockets/app
    depends_on: [redis]
    expose:
      - 3003
    environment:
      - NODE_ENV=${NODE_ENV}
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - VAULT_ADDR=${VAULT_ADDR}
      - VAULT_TOKEN=${VAULT_ROOT_TOKEN}
    networks:
      - internal
    volumes:
      - /data/node_modules
      # - sqlite_data:/data/sqlite
      # - ./volume/redis_data:/data
      - ./services/realtime-sockets/app:/data
      - ./services/game-engine/app/srcs:/game-engine/app/srcs:ro
      - ./certs:/certs:ro


  game-engine_app:
    container_name: game-engine_app
    build:
      context: ./services/game-engine/app
    expose:
      - 3007
    environment:
      - NODE_ENV=${NODE_ENV}
    networks:
      - internal
    volumes:
      - /data/node_modules
      # - sqlite_data:/data/sqlite
      # - ./volume/redis_data:/data
      - ./services/game-engine/app:/data
      - ./certs:/certs:ro

  backend-ai_app:
    container_name: backend-ai_app
    build:
      context: ./services/backend-ai/app
    expose:
      - 3004
    environment:
      - NODE_ENV=${NODE_ENV}
      - VAULT_ADDR=${VAULT_ADDR}
      - VAULT_TOKEN=${VAULT_ROOT_TOKEN}

    volumes:
      - /data/node_modules
      # - sqlite_data:/data/sqlite
      # - ./volume/redis_data:/data
      - ./services/backend-ai/app:/data
      - ./certs:/certs:ro
    networks:
      - internal


######################################################################
#*************************🚀 CORE SERVICES ***************************
######################################################################


  mailpit:
    image: axllent/mailpit
    container_name: gt_mailpit
    ports:
      - "8025:8025"    # Interface web
      - "1025:1025"    # SMTP
    restart: unless-stopped
    networks:
      - internal

  mail:
    container_name: mail
    build:
      context: ./services/mail/app/
    ports:
      - 3300:3300
    environment:
      - NODE_ENV=${NODE_ENV}
      - VAULT_ADDR=${VAULT_ADDR}
      - VAULT_TOKEN=${VAULT_ROOT_TOKEN}
    volumes:
      - ./services/mail/app:/data
      - /data/node_modules
      - ./certs:/certs:ro
    networks:
      - internal
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    restart: on-failure


  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbit
    ports:
      - "5672:5672"    # port principal AMQP (clients)
      - "15672:15672"  # interface web management
    environment:
      - NODE_ENV=${NODE_ENV}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - internal
    restart: unless-stopped

  redis:
    container_name: redis
    image: redis:7
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    networks:
      - internal
    volumes:
      - ./volumes/redis_data:/data

######################################################################
#************************** 📦 FRONTEND *******************************
######################################################################

  frontend_app:
    container_name: frontend_app
    build:
      context: ./services/frontend
    expose:
      - 3006
    volumes:
      - ./services/frontend/srcs:/app/srcs
      - ./services/frontend/locales:/app/locales
    networks:
      - internal
      - transcendence


######################################################################
######################### 🌐​ NETWORKS & VOLUMES ######################
######################################################################

networks:
  internal:
    driver: bridge
  transcendence:
    driver: bridge

volumes:
  rabbitmq_data:
  
