services:


######################################################################
#************************** 🧬 PROXY / NGINX *************************
######################################################################

  gateway:
    container_name: gateway
    build:
      context: .
      args: {}
      dockerfile: ./requirements/gateway/Dockerfile
    networks:
    - transcendence
    - internal
    ports:
      - "8080:80"
    volumes:
      - ./requirements/gateway/nginx/nginx.conf:/etc/nginx/nginx.conf
    user: "0:0"
    restart: unless-stopped
    environment: {}
    depends_on:
      - auth_app
      - live-chat_app


######################################################################
#************************** 📦 BACKEND *******************************
######################################################################

# AUTH_SERVICE : 3000
# LANGUAGE_MANAGER_SERVICE : 3001
# LIVE_CHAT_SERVICE : 3002
# REMOTE_PLAYER_SERVICE : 3003
# MATCH_MAKING : 3004
# SERVER-RENDERING : 3003

  server-rendering_app:
    container_name: server-rendering_app
    build:
      context: ./requirements/server-rendering/app
    expose:
      - 3005
    # volumes:
    #   - sqlite_data:/data
    networks:
      - internal

  auth_app:
    container_name: auth_app
    build:
      context: ./requirements/auth/app
    ports:
      - 3000:3000
    environment:
      - NODE_ENV=${NODE_ENV}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - CSRF_SECRET=${CSRF_SECRET}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASSWORD=${RABBITMQ_DEFAULT_PASS}
    volumes:
      - /data/node_modules
      # - sqlite_data:/data
      # - ./volume/redis_data:/data
      - ./requirements/auth/app:/data
    networks:
      - internal
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    restart: on-failure

  language-manager_app:
    container_name: language-manager_app
    build:
      context: ./requirements/language-manager/app
    expose:
      - 3001
    # volumes:
    #   - sqlite_data:/data
    networks:
      - internal

  live-chat_app:
    container_name: live-chat_app
    build:
      context: ./requirements/live-chat/app
    expose:
      - 3002
    volumes:
      - ./volumes/live-chat:/data
    networks:
      - internal

  remote-players_app:
    container_name: remote-players_app
    build:
      context: ./requirements/remote-players/app
    expose:
      - 3003
    networks:
      - internal

  match-maker_app:
    container_name: match-maker_app
    build:
      context: ./requirements/match-maker/app
    expose:
      - 3004
    # volumes:
    #   - sqlite_data:/data
    networks:
      - internal


######################################################################
#*************************🚀 CORE SERVICES ***************************
######################################################################


  mailpit:
    image: axllent/mailpit
    container_name: gt_mailpit
    ports:
      - "8025:8025"    # Interface web
      - "1025:1025"    # SMTP
    restart: unless-stopped
    networks:
      - internal

  mail:
    container_name: mail
    build:
      context: ./requirements/mail/app/
    ports:
      - 3300:3300
    environment:
      - NODE_ENV=${NODE_ENV}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASSWORD=${RABBITMQ_DEFAULT_PASS}
    volumes:
      - ./requirements/mail/app:/data
      - /data/node_modules
    networks:
      - internal
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    restart: on-failure


  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbit
    ports:
      - "5672:5672"    # port principal AMQP (clients)
      - "15672:15672"  # interface web management
    environment:
      - NODE_ENV=${NODE_ENV}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s 
    networks:
      - internal
    restart: unless-stopped

  redis:
    container_name: redis
    image: redis:7
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"    
    networks:
      - internal
    volumes:
      - ./volume/redis_data:/data



######################################################################
######################### 🌐​ NETWORKS & VOLUMES ######################
######################################################################

networks:
  internal:
    driver: bridge
  transcendence:
    driver: bridge
