services:


######################################################################
#************************** 🧬 PROXY / NGINX *************************
######################################################################


  modsecurity:
    container_name: modsecurity
    build:
      context: .
      dockerfile: ./services/security/temp/Dockerfile
      args:
        HOME: ${HOME}
        NODE_ENV: ${NODE_ENV}

    ports:
      - 443:443
    networks:
      - internal
      - transcendence
    expose:
      - 443
    env_file:
      - .env
    depends_on:
      - gateway


  gateway:
    container_name: gateway
    build:
      context: .
      args: {}
      dockerfile: ./services/gateway/Dockerfile
    networks:
    - transcendence
    - internal
    ports:
      - 8080:8080
      # - 443:443  # Uncomment for evaluation/production with HTTPS
    expose:
      - 8080
      - 443
    volumes:
      - ./services/gateway/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./certs:/certs:ro
    user: "0:0"
    restart: unless-stopped
    environment: {}
    depends_on:
      - auth_app
      - live-chat_app
      - realtime-sockets_app
      - remote-players_app
      - frontend_app


######################################################################
#************************** 📦 BACKEND *******************************
######################################################################

# AUTH_SERVICE : 3000
# LANGUAGE_MANAGER_SERVICE : 3001
# LIVE_CHAT_SERVICE : 3002
# REMOTE_PLAYER_SERVICE : 3003
# MATCH_MAKING : 3004
# SERVER-RENDERING : 3003
# game-engine : 3007
# BLOCKCHAIN : 4000

  server-rendering_app:
    container_name: server-rendering_app
    build:
      context: ./services
      dockerfile: server-rendering/app/Dockerfile
    expose:
      - 3005
    volumes:
      - /data/node_modules
      # - ./services/server-rendering/app:/data
      # - sqlite_data:/data
      # - ./volume/redis_data:/data
      - ./certs:/certs:ro
    networks:
      - internal
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - NODE_ENV=${NODE_ENV}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - CSRF_SECRET=${CSRF_SECRET}
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    restart: on-failure

  auth_app:
    container_name: auth_app
    build:
      context: ./services/auth/app
    expose:
      - 3000
    environment:
      - NODE_ENV=${NODE_ENV}
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - CSRF_SECRET=${CSRF_SECRET}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - FORTYTWO_CLIENT_ID=${FORTYTWO_CLIENT_ID}
      - FORTYTWO_CLIENT_SECRET=${FORTYTWO_CLIENT_SECRET}
      - FORTYTWO_REDIRECT_URI=${FORTYTWO_REDIRECT_URI}
    volumes:
      - /data/node_modules
      # - sqlite_data:/data/sqlite
      # - ./volume/redis_data:/data
      - ./services/auth/app:/data
      - ./certs:/certs:ro
    networks:
      - internal
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    restart: on-failure

  language-manager:
    container_name: language-manager_app
    build:
      context: ./services/language-manager
    expose:
      - 3001
    environment:
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - NODE_ENV=${NODE_ENV}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECRET=${COOKIE_SECRET}
    volumes:
      - ./services/language-manager:/data
      - language-manager-node-modules:/data/node_modules
      - ./certs:/certs:ro
    networks:
      - internal

  live-chat_app:
    container_name: live-chat_app
    build:
      context: ./services/live-chat/app
    expose:
      - 3002
    environment:
      - NODE_ENV=${NODE_ENV}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECRET=${COOKIE_SECRET}
    volumes:
      - ./services/live-chat/app:/data
      - /data/node_modules
      - ./certs:/certs:ro
    networks:
      - internal
    depends_on:
      redis:
        condition: service_started

  realtime-sockets_app:
    container_name: realtime-sockets_app
    build:
      context: ./services/realtime-sockets/app
    depends_on: [redis]
    expose:
      - 3003
    environment:
      - NODE_ENV=${NODE_ENV}
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - CSRF_SECRET=${CSRF_SECRET}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - FORTYTWO_CLIENT_ID=${FORTYTWO_CLIENT_ID}
      - FORTYTWO_CLIENT_SECRET=${FORTYTWO_CLIENT_SECRET}
      - FORTYTWO_REDIRECT_URI=${FORTYTWO_REDIRECT_URI}
    networks:
      - internal
    volumes:
      - /data/node_modules
      - ./services/realtime-sockets/app:/data
      - ./certs:/certs:ro

  remote-players_app:
    container_name: remote-players_app
    build:
      context: ./services/remote-players/app
    depends_on: [redis]
    expose:
      - 3004
    environment:
      - NODE_ENV=${NODE_ENV}
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - CSRF_SECRET=${CSRF_SECRET}
      - AUTH_INTERNAL_URL=https://auth_app:3000
    networks:
      - internal
    volumes:
      - /data/node_modules
      - ./services/remote-players/app:/data
      - ./services/game-engine/app/srcs:/game-engine/app/srcs:ro
      - ./certs:/certs:ro

  blockchain:
    container_name: blockchain
    build:
      context: ./services/blockchain/app
    expose:
      - 4000
    environment:
      - NODE_ENV=${NODE_ENV}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - CSRF_SECRET=${CSRF_SECRET}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - FORTYTWO_CLIENT_ID=${FORTYTWO_CLIENT_ID}
      - FORTYTWO_CLIENT_SECRET=${FORTYTWO_CLIENT_SECRET}
      - FORTYTWO_REDIRECT_URI=${FORTYTWO_REDIRECT_URI}
      - BC_WALLET=${BC_WALLET}
      - BC_PK=${BC_PK}
    networks:
      - internal
    volumes:
      - /data/node_modules
      # - sqlite_data:/data/sqlite
      # - ./volume/redis_data:/data
      - ./services/blockchain/app:/data
      - ./certs:/certs:ro



  game-engine_app:
    container_name: game-engine_app
    build:
      context: ./services/game-engine/app
    expose:
      - 3007
    environment:
      - NODE_ENV=${NODE_ENV}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - CSRF_SECRET=${CSRF_SECRET}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASSWORD=${RABBITMQ_DEFAULT_PASS}
      # - FORTYTWO_CLIENT_ID=${FORTYTWO_CLIENT_ID}
      # - FORTYTWO_CLIENT_SECRET=${FORTYTWO_CLIENT_SECRET}
      # - FORTYTWO_REDIRECT_URI=${FORTYTWO_REDIRECT_URI}
    networks:
      - internal
    volumes:
      - /data/node_modules
      # - sqlite_data:/data/sqlite
      # - ./volume/redis_data:/data
      - ./services/game-engine/app:/data
      - ./certs:/certs:ro

  backend-ai_app:
    container_name: backend-ai_app
    build:
      context: ./services/backend-ai/app
    expose:
      - 3004
    environment:
      - NODE_ENV=${NODE_ENV}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - CSRF_SECRET=${CSRF_SECRET}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASSWORD=${RABBITMQ_DEFAULT_PASS}
      # - FORTYTWO_CLIENT_ID=${FORTYTWO_CLIENT_ID}
      # - FORTYTWO_CLIENT_SECRET=${FORTYTWO_CLIENT_SECRET}
      # - FORTYTWO_REDIRECT_URI=${FORTYTWO_REDIRECT_URI}
    volumes:
      - /data/node_modules
      # - sqlite_data:/data/sqlite
      # - ./volume/redis_data:/data
      - ./services/backend-ai/app:/data
      - ./certs:/certs:ro
    networks:
      - internal


######################################################################
#*************************🚀 CORE SERVICES ***************************
######################################################################


  mailpit:
    image: axllent/mailpit
    container_name: gt_mailpit
    ports:
      - "8025:8025"    # Interface web
      - "1025:1025"    # SMTP
    restart: unless-stopped
    networks:
      - internal

  mail:
    container_name: mail
    build:
      context: ./services/mail/app/
    ports:
      - 3300:3300
    environment:
      - NODE_ENV=${NODE_ENV}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASSWORD=${RABBITMQ_DEFAULT_PASS}
    volumes:
      - ./services/mail/app:/data
      - /data/node_modules
      - ./certs:/certs:ro
    networks:
      - internal
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    restart: on-failure


  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbit
    ports:
      - "5672:5672"    # port principal AMQP (clients)
      - "15672:15672"  # interface web management
    environment:
      - NODE_ENV=${NODE_ENV}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - internal
    restart: unless-stopped

  redis:
    container_name: redis
    image: redis:7
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    networks:
      - internal
    volumes:
      - ./volumes/redis_data:/data

######################################################################
#************************** 📦 FRONTEND *******************************
######################################################################

  frontend_app:
    container_name: frontend_app
    build:
      context: ./services/frontend
    expose:
      - 3006
    volumes:
      - ./services/frontend/srcs:/app/srcs
      - ./services/frontend/locales:/app/locales
    networks:
      - internal
      - transcendence


######################################################################
#************************** 📊 MONITORING ****************************
######################################################################

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - internal
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "9000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - internal
    depends_on:
      - prometheus
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "9121:9121"
    networks:
      - internal
    depends_on:
      - redis
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8081:8080"
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - internal
    restart: unless-stopped


######################################################################
######################### 🌐​ NETWORKS & VOLUMES ######################
######################################################################

networks:
  internal:
    driver: bridge
  transcendence:
    driver: bridge

volumes:
  rabbitmq_data:
  language-manager-node-modules:
  prometheus_data:
  grafana_data:
