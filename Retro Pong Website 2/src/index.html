<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Arcade - Synthwave Pong</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles/globals.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Orbitron', monospace;
        }
        
        #app {
            width: 100%;
            height: 100%;
        }

        /* Loading screen */
        .loading-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(180deg, #0a0a2e 0%, #16213e 50%, #0f0f23 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }

        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-title {
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            background: linear-gradient(45deg, #ff1493, #00ffff, #9d4edd);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient-shift 3s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(255, 20, 147, 0.5);
            margin-bottom: 2rem;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid transparent;
            border-top: 3px solid #ff1493;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes gradient-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
        <div class="loading-title">NEON ARCADE</div>
        <div class="loading-spinner"></div>
    </div>

    <!-- Main App Container -->
    <div id="app"></div>

    <!-- Scripts -->
    <script type="module">
        // Hide loading screen after a short delay
        setTimeout(() => {
            const loadingScreen = document.getElementById('loading-screen');
            if (loadingScreen) {
                loadingScreen.classList.add('hidden');
                setTimeout(() => {
                    loadingScreen.remove();
                }, 500);
            }
        }, 1500);

        // Import and initialize the main application
        import('./main.js').catch(error => {
            console.error('Failed to load application:', error);
            
            // Show error message
            const app = document.getElementById('app');
            if (app) {
                app.innerHTML = `
                    <div class="retro-container size-full flex items-center justify-center p-8">
                        <div class="text-center retro-text">
                            <h1 class="retro-title text-3xl mb-4 text-red-400">ERROR</h1>
                            <p class="text-red-300">Failed to load the application. Please refresh the page.</p>
                        </div>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
